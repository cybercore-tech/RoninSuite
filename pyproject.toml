[project]
name = "roninsuite"
version = "0.1.0"
description = "RoninSuite - a portable TUI pentest toolkit for Linux (tactical & offensive), with tiered CVSS reporting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "darkstar" }]
dependencies = [
    "textual>=0.79",
    "typer>=0.12",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "markdown>=3.6",
    "pygments>=2.18",
    "weasyprint>=62",
    "pyyaml>=6.0",
    "rich>=13.7",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "textual-dev>=1.5"]

[project.scripts]
ronin = "ronin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ronin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
